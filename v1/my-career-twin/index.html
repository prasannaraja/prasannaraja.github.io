        <script>
            (function () {
                try {
                    var saved = localStorage.getItem('theme');
                    var isDark = saved
                        ? saved === 'dark'
                        : window.matchMedia('(prefers-color-scheme: dark)')
                              .matches;
                    if (isDark) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                } catch (e) {}
            })();
